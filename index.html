<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--navy:#1E3A5F;--navy2:#2c5282;--ink:#1b2430;--muted:#5f6b7a;--line:#d7dee8;--bg:#f3f6fa;--card:#fff;--ok:#2f855a;--warn:#c05621;--sand:#f6f2eb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:70;background:#fff;border-bottom:3px solid var(--navy);box-shadow:0 2px 8px rgba(30,58,95,.08)}
.top .bar{display:flex;align-items:center;gap:8px;padding:8px 12px}
.top img{height:30px;width:auto;display:block}
.top .grow{flex:1;min-width:0}
.top .cur{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.tb{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:7px 11px;font-weight:600;font-size:14px}
.tb.solid{background:var(--navy);color:#fff}
.nav{display:flex;gap:6px;overflow-x:auto;padding:6px 10px 8px;scrollbar-width:none;background:var(--navy)}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;color:#fff;text-decoration:none;font-size:13px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);white-space:nowrap}
.nav a b{display:inline-block;min-width:18px;margin-left:4px;padding:0 5px;border-radius:9px;background:rgba(255,255,255,.25);font-size:11px;text-align:center}
main{max-width:760px;margin:0 auto;padding:10px 10px 90px}
.sec{background:var(--card);border-radius:14px;margin:10px 0;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--line);overflow:hidden}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px;cursor:pointer;font-weight:700;color:var(--navy);font-size:17px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .num{flex:0 0 28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.sec>summary .t{flex:1}
.sec>summary .cnt{font-size:12px;font-weight:600;color:var(--muted);background:var(--bg);border-radius:999px;padding:2px 8px}
.sec>summary .cnt.has{color:#fff;background:var(--ok)}
.sec>summary:after{content:"\25BE";color:var(--muted);transition:transform .2s}
.sec[open]>summary:after{transform:rotate(180deg)}
.body{padding:2px 14px 14px;display:flex;flex-wrap:wrap;gap:0 12px;border-top:1px solid var(--line)}
.f{flex:1 1 100%;margin-top:12px;min-width:0}
.f.half{flex:1 1 calc(50% - 6px)}
.f.third{flex:1 1 calc(33.33% - 8px)}
.f>label,.f>.lbl{display:block;font-size:13px;font-weight:600;color:#33475f;margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);margin:-2px 0 6px}
.h{flex:1 1 100%;margin:18px 0 0;padding-bottom:4px;border-bottom:1px dashed var(--line);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);font-weight:800}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=search],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fbfcfe;font-size:16px;min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--navy2);background:#fff}
.unitwrap{position:relative}.unitwrap span{position:absolute;right:12px;top:11px;color:var(--muted);font-size:14px;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid #b8c4d4;background:#fff;border-radius:999px;padding:8px 13px;min-height:40px;font-size:14px;line-height:1.2;cursor:pointer;color:#22324a}
.chip[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chip.multi[aria-pressed=true]:before{content:"\2713  "}
.rate{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rate .chip{border-radius:10px;padding:10px 0;font-weight:700;font-size:16px;text-align:center}
.other{margin-top:6px}
.checks label{display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid #eef1f5;font-size:15px}
.checks input,.check input{width:22px;height:22px;flex:0 0 22px;accent-color:var(--navy);margin:0}
.check{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.step{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;width:max-content;background:#fff}
.step button{width:44px;height:42px;border:0;background:var(--bg);font-size:20px;color:var(--navy);font-weight:700}
.step output{min-width:42px;text-align:center;font-weight:700;font-size:17px}
.card{flex:1 1 100%;border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:12px;margin-top:12px;background:#fcfdff}
.card>.ch{display:flex;align-items:center;gap:8px;padding:9px 10px;background:#eef3f9;border-radius:8px 8px 0 0}
.card>.ch .ct{flex:1;font-weight:700;color:var(--navy);font-size:15px}
.card>.cb{padding:0 10px 12px;display:flex;flex-wrap:wrap;gap:0 12px}
.card .card{border-left-color:#7d96b5}
.x{border:0;background:transparent;color:var(--warn);font-size:13px;font-weight:600;padding:6px}
.add{flex:1 1 100%;margin-top:10px;border:1.5px dashed var(--navy2);background:#fff;color:var(--navy);border-radius:10px;padding:11px;font-weight:700}
.calc{flex:1 1 100%;margin-top:12px;background:var(--sand);border-radius:10px;padding:10px 12px;font-size:14px}
.calc table{width:100%;border-collapse:collapse}.calc td{padding:3px 0}.calc td:last-child{text-align:right;font-weight:700}
.calc .big{font-size:20px;color:var(--navy)}
.info{flex:1 1 100%;font-size:14px;color:#33475f}
.info p{margin:10px 0 0}
.muted{color:var(--muted);font-size:13px}
.ref{margin-top:10px;background:var(--bg);border-radius:10px;padding:8px 12px}
.ref summary{font-weight:700;color:var(--navy);cursor:pointer}
.ref ul{padding-left:18px;margin:8px 0}
[hidden]{display:none!important}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.foot .st{flex:1;font-size:12px;color:var(--muted)}
.contact{text-align:center;font-size:12px;color:var(--muted);padding:18px 8px 4px}
.contact a{color:var(--navy)}
/* home */
.hero{background:var(--navy);color:#fff;border-radius:14px;padding:16px;margin:10px 0}
.hero h1{margin:0 0 4px;font-size:20px}.hero p{margin:0;font-size:14px;opacity:.85}
.big{width:100%;border:0;border-radius:12px;padding:15px;font-size:17px;font-weight:700;background:var(--navy);color:#fff;margin:6px 0}
.big.alt{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.ins{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.ins .a{font-weight:700;color:var(--navy)}.ins .m{font-size:13px;color:var(--muted);margin:2px 0 8px}
.ins .row{display:flex;gap:6px;flex-wrap:wrap}
/* sheet (export menu) */
.dlg{position:fixed;inset:0;background:rgba(15,25,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.dlg .pn{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
.dlg h3{margin:4px 0 10px;color:var(--navy)}
.dlg .big{margin:6px 0}
.dlg textarea{min-height:220px;font:12px/1.35 ui-monospace,Menlo,Consolas,monospace}
.toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:.95}
#printView{display:none}
@media (min-width:700px){.f.half{flex:1 1 calc(50% - 6px)}}
@media print{
  @page{size:letter;margin:.5in .45in}
  body{background:#fff}
  .top,.foot,main,.dlg,.toast{display:none!important}
  #printView{display:block;font-size:10.5pt;color:#000}
  #printView .ph{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--navy);padding-bottom:6px;margin-bottom:8px}
  #printView .ph img{height:34px}
  #printView h2{font-size:12pt;color:#fff;background:var(--navy);padding:3px 8px;margin:12px 0 4px;-webkit-print-color-adjust:exact;print-color-adjust:exact;break-after:avoid}
  #printView h4{margin:6px 0 2px;font-size:10.5pt;color:var(--navy);break-after:avoid}
  #printView table{width:100%;border-collapse:collapse}
  #printView td{border-bottom:1px solid #ddd;padding:2px 4px;vertical-align:top}
  #printView td:first-child{width:38%;color:#333}
  #printView tr{break-inside:avoid}
  #printView .pf{margin-top:14px;border-top:1px solid #999;padding-top:6px;font-size:9pt;text-align:center;color:#444}
}

.phs{flex:1 1 100%;display:grid;grid-template-columns:1fr;gap:8px;margin:8px 0}
.phslot{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fbfcfe}
.phslot .pt{font-weight:700;color:var(--navy);font-size:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.phslot .pt b{font-size:12px;color:#fff;background:var(--ok);border-radius:999px;padding:1px 8px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.thumb{position:relative;width:96px}
.thumb img{width:96px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.thumb .r{display:flex;gap:4px;margin-top:4px}.thumb .r button{flex:1;font-size:12px;padding:4px 2px}
.stat{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--bg);color:var(--muted);margin-left:6px}
.stat.s-prefilled{background:#e6eef8;color:var(--navy2)}.stat.s-progress{background:#fdf0e6;color:var(--warn)}.stat.s-ready{background:#e3f4ea;color:var(--ok)}
.big.go{background:var(--ok);border-color:var(--ok)}

.stat.s-miss{background:#fde8e4;color:#b42318}.stat.s-unpaid{background:#fff4d6;color:#8a5a00}
ul.miss{margin:6px 0;padding-left:20px}ul.miss li{margin:6px 0}ul.miss a{color:#b42318;font-weight:600}ul.miss.warn a{color:#8a5a00}
.flash{outline:3px solid #f59e0b;outline-offset:3px;border-radius:8px}
#ovReason{width:100%;min-height:70px;font-size:16px}

[data-home]{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#homeBtn{min-height:40px;min-width:48px;position:relative;z-index:1}
.top .grow{align-self:stretch;display:flex;align-items:center;justify-content:flex-end}
.top .cur{width:100%}

</style>

{ id:'cq', title:'Condition & Quality', short:'C & Q', fields:[
  {t:'info', html:'<p>UAD 3.6 builds the overall ratings from components: each dwelling gets an <b>exterior</b> Q/C (Exterior section) and each unit gets an <b>interior</b> Q/C (Interior section), supported by the condition status of walls, foundation, roof, windows, kitchens, baths, flooring and walls/ceilings. Interior and exterior ratings reflect the property as if required repairs are done; current problems go in Damages, Defects &amp; Deficiencies.</p>'},
  {t:'calc', fn:'cqSummary', l:'Component summary (auto)'},
  {k:'overallQ', l:'Overall Quality (reconciled)', t:'rating', o:QR},
  {k:'overallC', l:'Overall Condition (reconciled)', t:'rating', o:CR},
  {k:'asIsC', l:'As-is condition if "subject to" repairs/completion', t:'rating', o:CR},
  {k:'cqNotes', l:'Rating support notes', t:'area', ph:'What drove the ratings: age of updates, deferred maintenance, workmanship...'},
  {t:'info', html:'<details class="ref"><summary>Quick reference: Condition C1-C6 (CPV field summary)</summary><ul><li><b>C1</b> New, never occupied, no physical depreciation.</li><li><b>C2</b> Virtually no deferred maintenance; recently renovated or built, nothing needs repair.</li><li><b>C3</b> Well maintained; limited wear, some components updated or replaced.</li><li><b>C4</b> Minor deferred maintenance and normal wear; adequately maintained, functional.</li><li><b>C5</b> Obvious deferred maintenance; some significant repairs needed, still usable.</li><li><b>C6</b> Substantial damage or deferred maintenance affecting safety, soundness or structural integrity.</li></ul></details><details class="ref"><summary>Quick reference: Quality Q1-Q6 (CPV field summary)</summary><ul><li><b>Q1</b> Unique, individually designed; exceptional materials and workmanship.</li><li><b>Q2</b> Custom-designed, high-quality finishes throughout.</li><li><b>Q3</b> Above-standard residential tract or custom; upgraded finishes.</li><li><b>Q4</b> Standard tract or builder plans; adequate, code-meeting materials.</li><li><b>Q5</b> Economy plans and materials; basic functional finishes.</li><li><b>Q6</b> Basic quality, minimal workmanship; may be substandard or not habitable as built.</li></ul><p class="muted">Field shorthand only. Rely on the official GSE definitions (Appendix F-1, Appendix 2) when writing the report.</p></details>'}
]},

<script>
(function(){

/* ---------- photo store (IndexedDB) ---------- */

    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(function(b){b?res({blob:b,w:c.width,h:c.height}):rej('encode');},'image/jpeg',q);};

function dataUrlToBlob(u){var m=/^data:([^;]+);base64,(.*)$/.exec(u);var bin=atob(m[2]),a=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:m[1]});}
function importPhotos(recId,list){return Promise.all((list||[]).map(function(p){if(!p||!p.dataUrl)return null;return photoPut({pid:uid(),rec:recId,slot:p.slot||'Additional',caption:p.caption||'',taken:p.taken||new Date().toISOString(),w:p.w,h:p.h,blob:dataUrlToBlob(p.dataUrl)});}));}
function syncPhotoCount(){if(!cur)return;var id=cur.id;photosOf(id).then(function(a){if(!cur||cur.id!==id)return;cur.photoCount=a.length;cur.data.photoCount=String(a.length);saveNow();});}
function photosField(f,parent){var wrap=h('div',{class:'phs'});parent.appendChild(wrap);var recId=cur.id;
  function draw(){photosOf(recId).then(function(all){wrap.innerHTML='';f.slots.forEach(function(slot){var mine=all.filter(function(p){return p.slot===slot;});
      var fi=h('input',{type:'file',accept:'image/*',capture:'environment',hidden:true,'data-slot':slot});var replace=null;

        h('button',{class:'tb',type:'button',style:'color:#c05621;border-color:#c05621',text:'Delete',onclick:function(){if(confirm('Delete this photo?'))photoDel(p.pid).then(function(){syncPhotoCount();draw();});}})])]));});
      wrap.appendChild(h('div',{class:'phslot',id:'slot-'+slug(slot)},[h('div',{class:'pt'},[h('span',{text:slot}),mine.length?h('b',{text:String(mine.length)}):null]),mine.length?thumbs:null,
        h('div',{class:'row'},[h('button',{class:'tb solid',type:'button',text:'Camera',onclick:function(){replace=null;fi.click();}}),' ',h('button',{class:'tb',type:'button',text:'Library',onclick:function(){replace=null;lib.click();}})]),fi,lib]));});

/* ---------- storage ---------- */
var cur=null, saveT=null;
function index(){return lsGet(KEY_IDX,[]);}

  if(!lsSet(KEY_PRE+cur.id,cur))return;
  var idx=index().filter(function(x){return x.id!==cur.id;});idx.unshift({id:cur.id,label:labelOf(cur.data),date:cur.data.inspDate||'',updated:cur.updated,status:cur.status||'In progress',photos:cur.photoCount||0});lsSet(KEY_IDX,idx);
  var st=$('#saveSt');if(st)st.textContent='Saved on this device '+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
  var c=$('#curLbl');if(c)c.textContent=labelOf(cur.data);}

function seed(fields,obj){fields.forEach(function(f){
  if(f.t==='rep'){if(!Array.isArray(obj[f.k]))obj[f.k]=[];while(obj[f.k].length<(f.min||0))obj[f.k].push({});obj[f.k].forEach(function(it){seed(f.fields,it);});}

/* ---------- visibility / walking ---------- */
function visible(f,obj,root){try{return !f.show||!!f.show(obj||{},root||{});}catch(e){return true;}}
function unitName(u,i){return (u.uid||('Unit '+(i+1)))+(u.isAdu==='Yes'?' (ADU)':'');}
function fmtVal(f,v,obj){
  if(f.t==='check')return v?'Yes':'';
  if(Array.isArray(v))v=v.map(function(x){return x==='Other'&&obj[f.k+'_o']?'Other: '+obj[f.k+'_o']:x;}).join(', ');
  else if(v==='Other'&&obj[f.k+'_o'])v='Other: '+obj[f.k+'_o'];
  if(f.unit&&v!=='')v=(f.unit==='$'?'$'+v:v+' '+f.unit);
  return String(v);}
/* walk visible answered data: emits {kind:'sec'|'group'|'field'|'calc', ...} */
function walk(fields,obj,root,emit,depth){fields.forEach(function(f){
  if(!visible(f,obj,root))return;
  if(f.t==='rep'){(obj[f.k]||[]).forEach(function(it,i){emit({kind:'group',title:f.title?f.title(it,i):(f.l+' '+(i+1)),depth:depth});walk(f.fields,it,root,emit,depth+1);});return;}

  if(!f.k)return;var v=obj[f.k];if(isEmpty(v))return;
  emit({kind:'field',label:f.l.replace(/\s*\(\d+\.\d+(-\d+\.\d+)?\)/g,''),value:fmtVal(f,v,obj),depth:depth});});}
function countFilled(sec,root){var n=0;walk(sec.fields,root,root,function(e){if(e.kind==='field')n++;},0);return n;}

/* ---------- calcs ---------- */
function num(v){var n=parseFloat(v);return isNaN(n)?0:n;}
var CALC={
 unitTotals:function(u,root,asText){var L=u.levels||[],ag=0,bgf=0,unf=0,ns=0,b=0,fb=0,hb=0,bgb=0;
   L.forEach(function(l){var below=l.grade&&l.grade!=='Above Grade';if(below){bgf+=num(l.finSf);bgb+=num(l.beds);}else ag+=num(l.finSf);unf+=num(l.unfSf);ns+=num(l.nsSf);b+=num(l.beds);fb+=num(l.fb);hb+=num(l.hb);});

   return '<table><tr><td>Above-grade finished (GLA)</td><td class="big">'+ag.toLocaleString()+' sf</td></tr><tr><td>Below-grade finished</td><td>'+bgf.toLocaleString()+' sf</td></tr><tr><td>Unfinished (all levels)</td><td>'+unf.toLocaleString()+' sf</td></tr>'+(ns?'<tr><td>Nonstandard finished</td><td>'+ns.toLocaleString()+' sf</td></tr>':'')+'<tr><td>Bedrooms / Full / Half baths</td><td>'+b+' / '+fb+' / '+hb+'</td></tr>'+(bgb?'<tr><td colspan=2 class="muted">'+bgb+' bedroom(s) below grade - GLA room count excludes below-grade rooms.</td></tr>':'')+'</table>';},
 cqSummary:function(o,root,asText){var rows=[];
   (root.structures||[]).forEach(function(s,i){var nm=s.sid||('Dwelling '+(i+1));rows.push([nm+' exterior',[s.extQ,s.extC].filter(Boolean).join(' / ')||'-','Walls: '+(s.wallsCond||'-')+'; Fdn: '+(s.fdnCond||'-')+'; Roof: '+(s.roofCond||'-')+'; Windows: '+(s.winCond||'-')]);});
   (root.units||[]).forEach(function(u,i){var k=(u.kitchens||[]).map(function(x,j){return 'K'+(j+1)+' '+(x.update||'-')+(x.when?' '+x.when:'')+', '+(x.cond||'-');}).join('; ');var b=(u.baths||[]).map(function(x,j){return 'B'+(j+1)+' '+(x.update||'-')+(x.when?' '+x.when:'')+', '+(x.cond||'-');}).join('; ');
     rows.push([unitName(u,i)+' interior',[u.intQ,u.intC].filter(Boolean).join(' / ')||'-',[k,b,'Floors: '+(u.floorCond||'-'),'Walls/ceil: '+(u.wallCond||'-')].filter(Boolean).join('; ')]);});
   if(asText)return rows.map(function(r){return r[0]+': '+r[1]+' ('+r[2]+')';}).join('\n');
   return '<table>'+rows.map(function(r){return '<tr><td><b>'+esc(r[0])+'</b><br><span class="muted">'+esc(r[2])+'</span></td><td class="big">'+esc(r[1])+'</td></tr>';}).join('')+'</table>';}
};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- form rendering ---------- */
var reg=null; // {vis:[], calcs:[], titles:[], counts:[]}

function refresh(){if(!reg)return;var root=cur.data;

function chipGroup(f,obj,multi,cls){var box=h('div',{class:cls||'chips'});var btns=[];

      if(multi){var a=Array.isArray(obj[f.k])?obj[f.k].slice():[];var i=a.indexOf(opt);

function field(f,obj,root,parent){

        ctl=h('div',{class:'step'},[h('button',{type:'button','aria-label':'minus',text:'\u2212',onclick:function(){st(-1);}}),out,h('button',{type:'button','aria-label':'plus',text:'+',onclick:function(){st(1);}})]);break;
    case 'area': ctl=h('textarea',{id:id,placeholder:f.ph||''});ctl.value=obj[f.k]||'';ctl.addEventListener('input',function(){obj[f.k]=ctl.value;changed();});break;
    default:
      var type=f.t==='num'?'text':f.t;var inp=h('input',{id:id,type:type,placeholder:f.ph||'',inputmode:f.t==='num'?'decimal':(f.mode||null),autocomplete:'off'});inp.value=obj[f.k]||'';
      inp.addEventListener('input',function(){obj[f.k]=f.t==='num'?inp.value.replace(/[^0-9.\-]/g,''):inp.value;changed();});

  readyDialog(name,share,dl);
  window.CPV._lastPackage=pkg;});}
function printView(){saveNow();var d=cur.data,pv=$('#printView'),html=[];
  html.push('<div class="ph"><img src="'+$('#logo').src+'" alt="CPV"><div style="text-align:right"><b>UAD 3.6 Field Inspection</b><br>'+esc(labelOf(d))+(d.zip?' '+esc(d.zip):'')+'<br>'+esc(d.inspDate||'')+'</div></div>');

      else if(e.kind==='calc')rows.push('<tr><td>'+esc(e.label)+'</td><td>'+esc(e.text).replace(/\n/g,'<br>')+'</td></tr>');
      else rows.push('<tr><td>'+esc(e.label)+'</td><td>'+esc(e.value).replace(/\n/g,'<br>')+'</td></tr>');},0);
    if(rows.some(function(r){return r.indexOf('<tr>')===0;}))html.push('<h2>'+(si+1)+'. '+esc(sec.title)+'</h2><table>'+rows.join('')+'</table>');});
  html.push('<div class="pf">'+esc(CONTACT)+'</div>');pv.innerHTML=html.join('');setTimeout(function(){window.print();},100);}
function exportMenu(){saveNow();var txt=summaryText();var ta=h('textarea',{readonly:true});ta.value=txt;
  var close=function(){dl.remove();};
  var dl=h('div',{class:'dlg',onclick:function(e){if(e.target===dl)close();}},[h('div',{class:'pn'},[
    h('h3',{text:'Export / share'}),
    h('button',{class:'big go',type:'button',text:'Send to AIVRE Drafter',onclick:function(){close();sendToDrafter();}}),

    h('button',{class:'big',type:'button',text:'Print / Save as PDF',onclick:function(){close();printView();}}),

    h('button',{class:'big alt',type:'button',text:'Email text summary',onclick:function(){location.href='mailto:?subject='+encodeURIComponent('CPV inspection - '+labelOf(cur.data))+'&body='+encodeURIComponent(txt.length>1800?txt.slice(0,1800)+'\n...(truncated - use Copy or Share for the full summary)':txt);}}),
    h('button',{class:'big alt',type:'button',text:'Copy text summary',onclick:function(){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){toast('Copied');},function(){ta.select();document.execCommand('copy');toast('Copied');});}}),

/* ---------- boot ---------- */
var CPV_BUILD='202610282131';
function checkUpdate(){if(location.protocol.indexOf('http')!==0||!window.fetch)return;
  fetch(location.origin+location.pathname+'?u='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():'';}).then(function(t){
    var m=/CPV_BUILD='(\d+)'/.exec(t||'');if(!m||m[1]===CPV_BUILD)return;
    var k='cpv_upd_'+m[1];try{if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,'1');}catch(e){}
    try{saveNow();}catch(e){}location.replace(location.pathname+'?v='+m[1]);}).catch(function(){});}
function goHome(ev){if(ev&&ev.preventDefault)ev.preventDefault();
  try{saveNow();}catch(e){}
  try{home();window.scrollTo(0,0);}catch(e){try{localStorage.removeItem(KEY_CUR);}catch(e2){}location.replace(location.pathname+'?home='+Date.now());}}

/* ---------- prepared jobs (jobs/index.json) ---------- */
var KEY_JOBS='cpv_jobs_seen',_jobsBusy=false;
function syncJobs(){if(_jobsBusy||location.protocol.indexOf('http')!==0||!window.fetch)return;_jobsBusy=true;
  var base=location.origin+location.pathname.replace(/[^\/]*$/,'')+'jobs/';
  var done=function(){_jobsBusy=false;};
  try{fetch(base+'index.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(ix){
    var list=(ix&&Array.isArray(ix.jobs))?ix.jobs:[];var seen=lsGet(KEY_JOBS,[]);if(!Array.isArray(seen))seen=[];
    var todo=list.filter(function(f){return typeof f==='string'&&/^[\w.\-]+\.json$/.test(f)&&seen.indexOf(f)<0;});
    return todo.reduce(function(p,f){return p.then(function(){
      return fetch(base+f+'?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).then(function(r){
        if(!r||!r.data)return;var jid=r.jobId||r.id||f;
        var have=index().some(function(x){var e=lsGet(KEY_PRE+x.id,null);return e&&e.jobId===jid;});
        var s2=lsGet(KEY_JOBS,[]);if(!Array.isArray(s2))s2=[];
        if(have||s2.indexOf(jid)>=0){if(s2.indexOf(f)<0){s2.push(f);lsSet(KEY_JOBS,s2);}return;}
        s2.push(f);s2.push(jid);if(!lsSet(KEY_JOBS,s2))return;
        r.jobId=jid;r.jobFile=f;var keep=cur;
        return importRec(r).then(function(n){cur=keep;if(keep)localStorage.setItem(KEY_CUR,keep.id);
          if(!keep)home();else{var c=$('#curLbl');if(c)c.textContent=labelOf(keep.data);}toast('New job added: '+labelOf(n.data));},function(){cur=keep;});
      }).catch(function(){});});},Promise.resolve());
  }).then(done,done);}catch(e){done();}}
var _lastHome=0;
function homeTap(ev){var t=ev.target&&ev.target.closest?ev.target.closest('[data-home]'):null;if(!t)return;
  if(!cur)return; var n=Date.now();if(n-_lastHome<600){ev.preventDefault();return;}_lastHome=n;goHome(ev);}
document.addEventListener('click',homeTap,true);
var _booted=false;
function boot(){if(_booted)return;_booted=true;
  $('#expBtn').addEventListener('click',exportMenu);$('#expBtn2').addEventListener('click',exportMenu);
  $('#topBtn').addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'});});
  document.addEventListener('visibilitychange',function(){if(document.hidden)saveNow();else{checkUpdate();syncJobs();}});
  window.addEventListener('pageshow',function(e){if(e.persisted){checkUpdate();syncJobs();}});
  setTimeout(checkUpdate,1500);setTimeout(syncJobs,300);window.addEventListener('focus',function(){checkUpdate();syncJobs();});
  window.addEventListener('pagehide',saveNow);
  if(/[?&]home=/.test(location.search)){try{localStorage.removeItem(KEY_CUR);history.replaceState(null,'',location.pathname);}catch(e){}}
  if(!openFromHash()){var c=localStorage.getItem(KEY_CUR);if(c&&lsGet(KEY_PRE+c,null))openRec(c);else home();}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(function(){});
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
window.CPV={validate:function(){return photosOf(cur.id).then(function(a){return validate(cur,a);});},version:APP_VERSION,summaryText:function(){return cur?summaryText():'';},current:function(){return cur;},buildPackage:buildPackage,sendToDrafter:sendToDrafter};
})();
